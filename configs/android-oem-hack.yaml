# Android OEM hack — патченый system с дампа Cyta

output_dir: build/android-oem-hack
partitions_dir: build/original/partitions
filesystem_dir: build/original/filesystems/system
assets_dir: build/android-oem-hack/assets
seed_dir: assets # logo/ssh из репо; остальное — url/from
e2fs_sbin: /opt/homebrew/opt/e2fsprogs/sbin

services_patch:
  docker_image: cytatv-android:dev
  work_dir: build/android-oem-hack/work/services
  api: 24

# cytasu root (ADVCA) — часть android-oem-hack
su:
  enabled: true
  ndk: /Users/dimajolkin/Library/Android/sdk/ndk/28.2.13676358
  api: 21
  host_tag: darwin-x86_64
  target: armv7a-linux-androideabi

# HiSi splash (JPEG → logo.img), часть android-oem-hack
logo:
  enabled: true
  jpeg: assets/logo/neutral.jpg
  size_mib: 16

flash:
  disk: ""
  force: false
  verify: false
  build: false
  wipe_userdata: true

# Приложения системного пользователя (uid=1000).
# Settings.apk: make apk-for-firmware в ../q22e-android-settings → assets через file://.
system_apps:
  - id: settings
    uid: 1000
    apk: Settings.apk
    guest: /priv-app/Settings/Settings.apk
    remove_stock: /app/Settings

# HOME / preferred — только yaml (Go не знает имён пакетов)
launcher:
  preferred_pkg: com.benny.openlauncher
  default_launcher: com.benny.openlauncher

reserve_apps:
  - system
  - system_server
  - com.android.systemui
  - com.android.settings
  - com.benny.openlauncher
  - com.android.bluetooth
  - com.hisilicon.android.hiRMService
  - com.huawei.hmt.hmtNetworkService
  - com.huawei.hmt.stbbgservice
  - com.huawei.toast
  - com.topjohnwu.magisk

# APK из assets → system.img
install_apps:
  - apk: OpenLauncher.apk
    guest: /priv-app/OpenLauncher/OpenLauncher.apk
    replace:
      - /priv-app/Lawnchair
      - /priv-app/OpenLauncher
  - apk: Magisk.apk
    guest: /priv-app/Magisk/Magisk.apk
  - apk: extras/TermOnePlus.apk
    guest: /app/TermOnePlus/TermOnePlus.apk
  - apk: extras/WifiAnalyzer.apk
    guest: /app/WifiAnalyzer/WifiAnalyzer.apk
  - apk: extras/Amaze.apk
    guest: /app/Amaze/Amaze.apk
  - apk: extras/Game2048.apk
    guest: /app/Game2048/Game2048.apk
  - apk: extras/Lightning.apk
    guest: /app/Lightning/Lightning.apk
  - apk: extras/WifiHub.apk
    guest: /app/WifiHub/WifiHub.apk
    optional: true

# Файлы для pipeline: скачивание в assets_dir, затем install*
# path — относительно assets_dir; from — архив уже в assets_dir
assets:
  - path: OpenLauncher.apk # seed: assets/OpenLauncher.apk (0.7.4, com.benny.openlauncher)

  - path: Magisk.apk
    url: https://github.com/topjohnwu/Magisk/releases/download/v25.2/Magisk-v25.2.apk

  - path: magisk-arm/cytasu-daemon
    optional: true # собирается при su.enabled
  - path: magisk-arm/su
    optional: true

  - path: magisk-arm/magisk
    from: Magisk.apk
    chmod: "0755"
    require_arm: true
    extract:
      member: lib/armeabi-v7a/libmagisk32.so
  - path: magisk-arm/magiskpolicy
    from: Magisk.apk
    chmod: "0755"
    require_arm: true
    extract:
      member: lib/armeabi-v7a/libmagiskpolicy.so
  - path: magisk-arm/busybox
    from: Magisk.apk
    chmod: "0755"
    require_arm: true
    extract:
      member: lib/armeabi-v7a/libbusybox.so

  - path: dropbear-arm/dropbear
    url: https://github.com/ribbons/android-dropbear/releases/download/DROPBEAR_2026.94/dropbear-armv7a-linux-androideabi.zip
    chmod: "0755"
    require_arm: true
    extract:
      member: dropbear
      also:
        - member: dropbearkey
          path: dropbear-arm/dropbearkey
        - member: scp
          path: dropbear-arm/scp
  - path: dropbear-arm/dropbearkey
    optional: true # из zip выше
  - path: dropbear-arm/scp
    optional: true

  - path: ssh/authorized_keys # seed: q22e keys → assets/ssh/

  - path: extras/TermOnePlus.apk
    url: https://f-droid.org/repo/com.termoneplus_570.apk
  - path: extras/WifiAnalyzer.apk
    url: https://f-droid.org/repo/com.vrem.wifianalyzer_72.apk
  - path: extras/Game2048.apk
    url: https://f-droid.org/repo/org.secuso.privacyfriendly2048_100.apk
  - path: extras/Amaze.apk
    url: https://f-droid.org/repo/com.amaze.filemanager_125.apk
  - path: extras/Lightning.apk
    url: https://f-droid.org/repo/acr.browser.lightning_101.apk
  - path: extras/WifiHub.apk
    optional: true # com.cytatv.wifihub — локальная сборка

  - path: logo/logo-neutral.img
    optional: true # собирается при logo.enabled
  - path: logo/neutral.jpg # seed_dir/assets/logo/

  - path: adb/adb_keys
    optional: true
  - path: services.jar
    optional: true
  - path: Settings.apk
    url: file://../q22e-android-settings/Settings.apk

  - path: bash-arm/bash
    url: https://raw.githubusercontent.com/Inknyto/arm-binaries/main/bash.tgz
    chmod: "0755"
    require_arm: true
    extract:
      member: system/xbin/bash
      also:
        - member: system/etc/inputrc
          path: bash-arm/inputrc
  - path: adbd-arm/adbd
    url: https://raw.githubusercontent.com/Inknyto/arm-binaries/main/adbd-non-root
    chmod: "0755"
    require_arm: true
